<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17171c"><meta name="description" content="Playform Studio, a visual game creation workspace."><title>Playform Studio</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><dialog id="create"><form id="create-form"><div class="dialog-top"><h2>Create a project</h2><button type="button" data-close aria-label="Close">×</button></div><label>Project name<input id="project-name" required maxlength="80" placeholder="My next game" autocomplete="off"></label><label>Template<select id="template"><option value="blank">Empty scene</option><option value="platformer">Platformer</option><option value="rhythm">Rhythm runner</option></select></label><p class="muted">Projects save on this device. Export a backup to move between devices.</p><button class="primary" type="submit">Create project →</button></form></dialog><dialog id="settings"><div class="dialog-top"><h2>Preferences</h2><button data-close aria-label="Close">×</button></div><label class="check"><input type="checkbox" id="ai">Enable optional AI Assistant</label><p class="muted">The editor works independently of AI. Assistant connection and approval workflow are planned for a later milestone.</p><label class="check"><input type="checkbox" id="motion">Reduce motion</label></dialog><input type="file" id="import" accept="application/json,.json" hidden><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
